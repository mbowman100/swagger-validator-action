name: 'Validate Swagger and OpenAPI'
description: 'Validate Swagger and OpenAPI documents using Swagger Parser'

branding:
  icon: 'award'
  color: 'green'

inputs:
  files:
    description: 'List of Swagger/OpenAPI file(s) to validate. Separate each file with a new line or a space.'
    required: true
  space_separated:
    description: 'Split on whitespace. Set false to allow spaces in newline-separated file paths.'
    required: false
    default: 'true'
outputs:
  invalidFiles:
    description: 'JSON array of invalid file paths.'
  validFiles:
    description: 'JSON array of valid file paths.'

runs:
  using: 'node24'
  main: 'dist/index.js'
